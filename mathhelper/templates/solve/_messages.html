{% for message in messages %}
{% if message.role == "user" %}
<div class="bubble-row user"><div class="msg user">{{ message.content }}</div></div>
{% else %}
<div class="bubble-row"><span class="tutor-avatar">{{ icon("sparkles") }}</span><div class="msg assistant rich">{{ message.content | rich }}</div></div>
{% endif %}
{% endfor %}
